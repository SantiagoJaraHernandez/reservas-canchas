name: CI - build y analisis de seguridad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [gateway, ms-auth, ms-reservas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar ${{ matrix.servicio }}
        working-directory: servicios/${{ matrix.servicio }}
        run: mvn -B -q -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build y auditoria de dependencias
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npm audit --omit=dev --audit-level=high

  compose-y-secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: |
          ./deploy/generate-env.sh >/dev/null
          docker compose config -q
          rm -f .env
      - name: Buscar secretos filtrados (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
