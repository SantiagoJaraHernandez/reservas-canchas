# Frontend estatico (React). Solo es accesible a traves de Caddy (red interna).
server {
    listen 8080;
    server_name _;

    # HARDENING: no revelar la version de nginx
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;

    # HARDENING: cabeceras de seguridad del navegador
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # HARDENING: bloquear archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # React Router
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }
}
