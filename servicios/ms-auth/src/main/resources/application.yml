server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-swallow-size: 256KB
    max-http-form-post-size: 256KB

spring:
  application:
    name: ms-auth
  main:
    banner-mode: off
  data:
    mongodb:
      # HARDENING: sin URI por defecto; incluye usuario/clave de Mongo
      uri: ${MONGODB_URI}
      auto-index-creation: true

# HARDENING: secreto obligatorio, token de 1 hora
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION_MS:3600000}

internal:
  token: ${INTERNAL_TOKEN:}

bootstrap:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
